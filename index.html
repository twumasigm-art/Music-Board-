<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Board</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Music Board</h1>

    <div class="music-container" id="music-container">
        <div class="music-info">
          <h4 id="title"></h4>
          <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
            </div>
        </div>

        <audio id="audio" src="music/ukukele.mp3"></audio>

        <div class="img-container">
          <img src="images/ukulele.jpg" alt="Album-cover" id="cover" />
        </div>

        <div class="navigation">
          <button id="prev" class="action-btn"><i class="fas fa-backward"></i></button>
          <button id="play" class="action-btn action-btn-big"><i class="fas fa-play"></i></button>
          <button id="next" class="action-btn"><i class="fas fa-forward"></i></button>
        </div>
    </div>
</body>
</html>
